name: Devlovers CI/CD Platform Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-and-test:
    name: Verify, Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Lint Verification
        run: npm run lint

      - name: Run Test Suite (139+ Unit & Route Tests)
        run: npm test

      - name: Next.js Production Build Verification
        run: npm run build
